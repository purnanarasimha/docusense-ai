name: DocuSense AI - Evaluation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every day at midnight
    - cron: '0 0 * * *'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy==1.26.4 --only-binary=all
          pip install -r requirements.txt

      - name: Run Quick Evaluation (10 questions)
        env:
          GOOGLE_API_KEY    : ${{ secrets.GOOGLE_API_KEY }}
          QDRANT_URL        : ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY    : ${{ secrets.QDRANT_API_KEY }}
          LANGCHAIN_API_KEY : ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "false"
        run: |
          python evals/run_evals.py --quick

      - name: Upload Eval Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/benchmark_results/

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/benchmark_results/latest.json';
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path));
              const r = data.report;
              const body = `## 📊 DocuSense AI Eval Results
              | Metric | Score |
              |--------|-------|
              | Correct Doc Rate | ${(r.correct_doc_rate*100).toFixed(1)}% |
              | Citation Rate | ${(r.citation_rate*100).toFixed(1)}% |
              | Avg Confidence | ${(r.avg_confidence*100).toFixed(1)}% |
              | Keyword Overlap | ${(r.avg_keyword_overlap*100).toFixed(1)}% |
              | Baseline | ${r.passed_baseline ? '✅ PASSED' : '❌ FAILED'} |`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }